{% if page.previous or page.next %}
  <nav class="editorial-pagination" aria-label="이전 글과 다음 글">
    {% if page.previous %}
      <a href="{{ page.previous.url | relative_url }}" class="editorial-pagination__link editorial-pagination__link--previous">
        <span>← 이전 글</span>
        <strong>{{ page.previous.title | markdownify | strip_html | strip }}</strong>
      </a>
    {% endif %}

    {% if page.next %}
      <a href="{{ page.next.url | relative_url }}" class="editorial-pagination__link editorial-pagination__link--next">
        <span>다음 글 →</span>
        <strong>{{ page.next.title | markdownify | strip_html | strip }}</strong>
      </a>
    {% endif %}
  </nav>
{% endif %}
